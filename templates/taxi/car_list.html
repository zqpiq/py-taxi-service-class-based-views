{% extends "base.html" %}
{% block content %}
  <h1>Cars:</h1>
  <ul>
    {% for car in car_list %}
      <li>
        <a href="{% url 'taxi:car-detail' car.id %}">
          Model: {{ car.model }}, Manufacturer: {{ car.manufacturer.name }}
        </a>
      </li>
    {% empty %}
      <li>No cars found.</li>
    {% endfor %}
  </ul>
{% endblock %}
